<style>
:root{--ink-900:#1a1d21;--ink-700:#3d434b;--ink-500:#6b7280;--ink-300:#cbd0d6;--ink-200:#e2e6ea;--ink-100:#f1f3f5;--ink-050:#f8f9fa;--surface:#ffffff;--accent-800:#10403c;--accent-700:#16544f;--accent-600:#1d6b64;--accent-100:#e6efee;--status-submitted:#6b7280;--status-received:#1d6b64;--status-accepted:#2563a8;--status-progress:#8a6100;--status-delivered:#2f6b3a;--status-closed:#3d434b;--status-rejected:#9b2c2c;--urgency-normal:#6b7280;--urgency-urgent:#8a6100;--urgency-emergency:#9b2c2c;--radius:3px;--border:1px solid var(--ink-300);--rule:1px solid var(--ink-200);--font-latin:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--font-arabic:"Segoe UI",Tahoma,"Geeza Pro","Noto Naskh Arabic","Arabic Typesetting",sans-serif;--font-mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;--sidebar-w:220px;--shadow:0 2px 6px rgba(26,29,33,0.18)}

.panel-head .actions{margin-inline-start:auto;display:flex;gap:8px}
.panel-body{padding:12px}
.grid{display:grid;gap:16px}
.btn{font:inherit;font-size:13px;line-height:1.2;padding:6px 11px;border-radius:var(--radius);border:var(--border);background:var(--surface);color:var(--ink-900);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background 120ms ease,border-color 120ms ease}
.btn:hover{background:var(--ink-100)}
.btn-primary{background:var(--accent-700);border-color:var(--accent-800);color:#fff;font-weight:600}
.btn-primary:hover{background:var(--accent-800)}

.field{margin-block-end:12px}

input:hover,select:hover,textarea:hover{border-color:var(--ink-500)}
.help{font-size:12px;color:var(--ink-500);margin-block-start:3px}
.err{font-size:12px;color:var(--status-rejected);margin-block-start:3px;font-weight:500}

table.data tr.row-overdue td:first-child{border-inline-start:3px solid var(--status-rejected)}
table.data th.sortable{cursor:pointer;user-select:none}
table.data th.sortable:hover{background:var(--ink-200)}
.sort-caret{font-size:9px;color:var(--ink-500);margin-inline-start:3px}
.sticky-first td:first-child,.sticky-first th:first-child{position:sticky;inset-inline-start:0;background:var(--surface)}
.sticky-first thead th:first-child{background:var(--ink-100);z-index:2}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 6px;border-radius:var(--radius);white-space:nowrap;border:1px solid currentColor}
.badge .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-500);border:1px dashed var(--ink-300);border-radius:var(--radius);padding:0 5px}
.postmvp{border:1px dashed var(--ink-300);border-radius:var(--radius);padding:9px 11px;color:var(--ink-500);background:var(--ink-050)}
.postmvp-head{display:flex;align-items:center;gap:8px;margin-block-end:3px}
.postmvp-head b{font-size:13px;font-weight:600;color:var(--ink-500)}
.postmvp p{font-size:12px;margin:0}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border:var(--border);border-radius:var(--radius);background:var(--surface)}
.metric{padding:12px 14px;border-inline-end:var(--rule)}
.metric:last-child{border-inline-end:0}
.metric .v{font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.metric .k{font-size:12px;color:var(--ink-500);margin-block-start:2px}
.metric.alert .v{color:var(--status-rejected)}
.filters{display:grid;gap:8px;padding:10px 12px;background:var(--ink-050);border-block-end:var(--rule);grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:end}
.filters .field{margin:0}
.filters .field>label{font-size:11px}
.result-count{font-size:12px;color:var(--ink-500);padding:7px 12px;border-block-end:var(--rule);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:0;border-block-end:var(--border);background:var(--surface)}
.tabs button{font:inherit;font-size:13px;background:none;border:0;cursor:pointer;padding:8px 13px;color:var(--ink-700);border-block-end:2px solid transparent;margin-block-end:-1px}
.tabs button:hover{background:var(--ink-100)}
.tabs button[aria-selected="true"]{color:var(--accent-800);font-weight:600;border-block-end-color:var(--accent-600)}
.pager{display:flex;align-items:center;gap:6px;padding:9px 12px;flex-wrap:wrap}
.pager .info{font-size:12px;color:var(--ink-500);margin-inline-end:auto}
.pager button{font:inherit;font-size:12px;min-width:26px;padding:2px 6px;cursor:pointer;border:var(--border);border-radius:var(--radius);background:var(--surface);color:var(--ink-700)}
.pager button:hover{background:var(--ink-100)}
.pager button[aria-current="page"]{background:var(--accent-700);border-color:var(--accent-800);color:#fff;font-weight:600}
.pager button[disabled]{opacity:.45;cursor:not-allowed}
.dir-icon{display:inline-flex}
html[dir="rtl"] .dir-icon{transform:scaleX(-1)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-500)}
.empty b{display:block;color:var(--ink-700);font-size:14px;margin-block-end:4px}
.timeline{display:flex;gap:0;overflow-x:auto;padding:4px 0 0}
.stage{flex:1 1 0;min-width:108px;padding-inline-end:8px}
.stage .bar{height:4px;background:var(--ink-200);border-radius:2px;margin-block-end:6px}
.stage.done .bar{background:var(--accent-600)}
.stage.current .bar{background:var(--status-progress)}
.stage .n{font-size:12px;font-weight:600;color:var(--ink-500)}
.stage.done .n,.stage.current .n{color:var(--ink-900)}

.detail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}

}

.note-body{font-size:13px}

.modal-body{padding:14px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-block-start:var(--rule);background:var(--ink-050)}

.toast{background:var(--ink-900);color:#f4f6f7;border-radius:var(--radius);padding:9px 11px;font-size:12px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow)}
.toast b{display:block;font-size:13px;margin-block-end:2px}
.toast button{margin-inline-start:auto;background:none;border:0;color:#b9c0c6;cursor:pointer;font:inherit;font-size:14px;line-height:1;padding:0 2px}
.login-wrap{min-height:100vh;display:flex;flex-direction:column;background:var(--ink-050)}
.login-bar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-block-end:var(--border)}
.login-main{flex:1 1 auto;display:flex;align-items:flex-start;justify-content:center;padding:48px 16px}
.login-card{width:100%;max-width:380px;background:var(--surface);border:var(--border);border-radius:var(--radius)}
.steps{display:flex;gap:0;border:var(--border);border-radius:var(--radius);background:var(--surface);overflow:hidden;margin-block-end:16px}
.step{flex:1 1 0;padding:9px 12px;border-inline-end:var(--rule);min-width:130px}
.step:last-child{border-inline-end:0}
.step .sn{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-500)}
.step .st{font-size:13px;color:var(--ink-500)}
.step.done .st{color:var(--ink-700)}
.step.active{background:var(--accent-100)}
.step.active .sn{color:var(--accent-700)}
.step.active .st{color:var(--accent-800);font-weight:600}
.appfoot{padding:10px 24px;font-family:var(--font-mono);font-size:11px;color:var(--ink-500);border-block-start:var(--rule);display:flex;gap:14px;flex-wrap:wrap}

.app.rail .sidebar{width:100%;flex:none}
.app.rail .nav a span,.app.rail .nav-group-label{display:none}

.nav{display:flex;flex-wrap:wrap;padding:4px 6px}
.nav-group-label{display:none}
.nav a{border-inline-start:0;border-block-end:3px solid transparent;padding:6px 9px}
.nav a.active{border-inline-start-color:transparent;border-block-end-color:var(--accent-600)}
.nav-count{margin-inline-start:4px}
.sidebar-foot{padding:6px 12px}
.content{padding:14px 12px 32px}
.topbar{padding:8px 12px}
.table-wrap{max-width:100%}

}

}
@media print{.sidebar,.topbar,.toasts,.demo-banner{display:none}
}

`</div>` +
`<div style="margin-block-start:16px">${mvp(
"Single sign-on and automated provisioning", "الدخول الموحد والتزويد الآلي",
"SAML or OIDC connection to the consortium identity provider.", "ربط SAML أو OIDC مع مزود هوية التحالف.")}</div>`;
};
CHANGES["set.overdueHours"] = (el) => { state.settings.overdueHours = Math.max(1, Number(el.value) || 72); commit(); };
CHANGES["set.sender"] = (el) => { state.settings.sender = el.value; persist(); };
CHANGES["set.trigger"] = (el) => { state.settings.triggers[el.getAttribute("data-k")] = el.checked; commit(); toast(t("set_notifications"), t("set_saved")); };
CHANGES["set.retention"] = (el) => { state.settings.retention[el.getAttribute("data-k")] = Number(el.value); commit(); };
CHANGES["set.anonymise"] = (el) => { state.settings.anonymise = el.checked; commit(); toast(t("set_anonymise"), t("set_saved")); };
CHANGES["set.sessionTimeout"] = (el) => { state.settings.sessionTimeout = Number(el.value); persist(); };
CHANGES["set.mfa"] = (el) => { state.settings.mfa[el.getAttribute("data-k")] = el.checked; commit(); };
CHANGES["set.defaultLang"] = (el) => { state.settings.defaultLang = el.value; state.lang = el.value; commit(); };
CHANGES["set.dateFormat"] = (el) => { state.settings.dateFormat = el.value; commit(); };
ACTIONS["set.reset"] = () => resetDemo();
VIEWS.notifications = function () {
if (!can("notifications")) return noAccess();
const rows = state.data.notifications.filter((n) => can("all_orgs") || n.org === state.org).slice(0, 60);
const table = tbl([t("timestamp"), t("notif_recipient"), t("notif_event"), t("case_reference"), t("notif_delivery"), t("actions")],
rows.map((n) => {
const u = userById(n.to);
return tr([[fmtDateTime(n.at), "mono nowrap"],
`${esc(u ? u.name : "—")}<div class="meta">${esc(u ? u.email : "")}</div>`,
esc(I18N[state.lang]["status_" + n.event] || t("action_request_info")), [esc(n.ref), "mono"],
T("notif_" + (n.status === "delivered" ? "delivered" : n.status === "queued" ? "queued" : "failed")),
btn(t("notif_preview"), "notif.open", "btn-sm", ` data-id="${n.id}"`)]);
}).join(""), "sticky-first");
return breadcrumbs([[t("nav_dashboard"), "#/dashboard"], [t("notif_title"), null]]) +
pageHead(t("notif_title"), state.settings.sender) +
P(null, `<div class="result-count">${esc(AR(
"A log of the emails the system would have sent. This prototype sends no email.",
"سجل الرسائل التي كان النظام سيرسلها. لا يرسل هذا النموذج الأولي أي بريد."))}</div>` + table) +
`<div style="margin-block-start:16px">${mvp(
"SMS, configurable reminder schedules, escalation chains", "الرسائل القصيرة، جداول التذكير، سلاسل التصعيد",
"Automatic SMS reminders and escalation to the field coordinator when the overdue threshold is passed.",
"تذكير تلقائي عبر الرسائل القصيرة وتصعيد إلى المنسق الميداني عند تجاوز حد التأخر.")}</div>`;
};
ACTIONS["notif.open"] = (el) => {
const n = state.data.notifications.find((x) => x.id === el.getAttribute("data-id"));
const r = findReferral(n.refId);
openModal({ title: t("notif_preview"), body: r ? emailBody(r, n.event) : `<p class="help">${T("no_results")}</p>` });
};
const HELP = [

"احصل على الموافقة المستنيرة قبل تسجيل أي بيانات عن الحالة. سجّل ما إذا كانت الموافقة شفهية أم كتابية ودوّن أي قيد يضعه المستفيد على مشاركة البيانات."],
["Search the service directory and confirm the selected service is open, within reach of the client and matches the eligibility criteria before selecting it.",
"ابحث في دليل الخدمات وتأكد أن الخدمة المختارة عاملة وفي متناول المستفيد وتطابق معايير الأهلية قبل اختيارها."],
["Keep the case summary factual and brief. Do not record identifying detail, incident narrative or any information the receiving partner does not need to deliver the service.",
"اجعل ملخص الحالة واقعياً وموجزاً. لا تسجل تفاصيل تعريفية أو سرداً للحادثة أو أي معلومة لا تحتاجها الجهة المستقبِلة لتقديم الخدمة."]]},
{ h: ["Acceptance and rejection", "القبول والرفض"], p: [

["A rejection must always carry a reason and, where useful, a suggested alternative provider. A rejection without a reason cannot be submitted.",
"يجب أن يتضمن الرفض دائماً سبباً، وعند الإمكان اقتراح مقدم خدمة بديل. لا يمكن إرسال رفض دون سبب."]]},
{ h: ["Escalation", "التصعيد"], p: [

"تُصعَّد الإحالات الموسومة بأنها طارئة إلى مدير الشريك المستقبِل فوراً ويُتوقع الإقرار بها في يوم العمل نفسه."],

];

VIEWS.help = function () {
const i = state.lang === "ar" ? 1 : 0;
const sec = (s) => P(s.h[i], PB(s.p.map((p) => `<p style="max-width:70ch">${esc(p[i])}</p>`).join("")));
return breadcrumbs([[t("nav_dashboard"), "#/dashboard"], [t("nav_help"), null]]) +
pageHead(t("help_title"), "SY-JO 0041") +
`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">` +
`<div>${HELP.slice(0, 3).map(sec).join("")}</div>` +
`<div>${HELP.slice(3).map(sec).join("")}` +
P("FAQ", PB(FAQ.map((f) => `<p><b>${esc(f[0][i])}</b><br>${esc(f[1][i])}</p>`).join(""))) +
P(AR("User manual", "دليل المستخدم"), PB(
`<p class="help" style="margin:0">${esc(AR(
"The full user manual is delivered in English and Arabic at handover, with short role-based training recordings.",
"يُسلَّم دليل المستخدم الكامل بالإنجليزية والعربية عند التسليم النهائي، مع تسجيلات تدريبية قصيرة لكل دور."))}</p>` +
`<p class="help">${esc(AR("Standard operating procedures, version 0.9 draft", "إجراءات التشغيل الموحدة، الإصدار ٠.٩ مسودة"))}</p>`)) +
`</div></div>` +
`<div style="margin-block-start:16px">${mvp(
"Kurdish (Kurmanji) language pack, KOBO, CPIMS and Primero interoperability",
"حزمة اللغة الكردية (الكرمانجية) والتشغيل البيني مع KOBO وCPIMS وبريميرو",

"ترجمة كاملة للواجهة إلى الكرمانجية وتبادل الحالات مع أنظمة إدارة الحالات القائمة.")}</div>`;
};
restore();
if (!location.hash) location.hash = state.authed ? "#/dashboard" : "#/login";
render();
